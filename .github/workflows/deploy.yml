name: Event Management System CI/CD

on:
  push:
    branches:
      - main

jobs:

  test:
    name: Test Backend and Frontend
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Backend Dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Backend Import Check
        working-directory: backend
        run: |
          python -c "from app.main import app; print('Backend import successful')"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy to EC2
    needs: test
    runs-on: ubuntu-latest

    steps:

      - name: Deploy Application
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          port: ${{ secrets.EC2_PORT }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/event-management-system/app

            git fetch origin main
            git reset --hard origin/main

            docker compose \
              --env-file /opt/event-management-system/.env \
              down

            docker compose \
              --env-file /opt/event-management-system/.env \
              up -d --build

            docker image prune -f

            docker compose \
              --env-file /opt/event-management-system/.env \
              ps
